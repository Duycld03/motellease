services:
  db:
    # PostGIS is required — not postgres:17-alpine. See docs/erd.md §8.
    image: postgis/postgis:17-3.5
    container_name: motellease-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: motellease
      POSTGRES_USER: motellease
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devonly_change_me}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motellease -d motellease"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: motellease-backend
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=motellease;Username=motellease;Password=${POSTGRES_PASSWORD:-devonly_change_me}"
      Jwt__SigningKey: "devonly-signing-key-change-me-at-least-32-bytes-long"
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:5004"
      App__ApiBaseUrl: "http://localhost:5004"
      App__WebBaseUrl: "http://localhost:3000"
    ports:
      - "5004:5004"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: "http://localhost:5004/api/v1"
        NUXT_PUBLIC_HUB_URL: "http://localhost:5004/hubs/notifications"
    container_name: motellease-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: motellease-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@motellease.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-devonly_change_me}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  ngrok:
    # Only needed to receive a payment gateway's IPN callback.
    image: ngrok/ngrok:latest
    container_name: motellease-ngrok
    restart: unless-stopped
    profiles: ["tunnel"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command:
      - http
      - --url=${NGROK_DOMAIN:-set-NGROK_DOMAIN-in-dot-env}
      - host.docker.internal:5004
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4040:4040"

volumes:
  db-data:
  pgadmin-data:
