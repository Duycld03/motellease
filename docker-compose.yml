services:
  db:
    # PostGIS is required — not postgres:17-alpine. See docs/erd.md §8.
    image: postgis/postgis:17-3.5
    container_name: motellease-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: motellease
      POSTGRES_USER: motellease
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devonly_change_me}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motellease -d motellease"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: motellease-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@motellease.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-devonly_change_me}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  ngrok:
    # Only needed to receive a payment gateway's IPN callback. That call is server-to-server:
    # MoMo's or VNPay's machine has to reach this one, and it cannot reach localhost. Everything
    # else in the payment flow — the redirect out and the browser's return — works without it.
    image: ngrok/ngrok:latest
    container_name: motellease-ngrok
    restart: unless-stopped
    profiles: ["tunnel"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    # The free plan's assigned dev domain is stable, so the URL registered in VNPay's merchant
    # portal stays valid between runs.
    #
    # Defaulted rather than declared required: compose interpolates every service before it filters
    # by profile, so `${NGROK_DOMAIN:?...}` would fail `docker compose up -d` for anybody who never
    # asked for a tunnel. Unset, ngrok refuses the placeholder domain and says so.
    command:
      - http
      - --url=${NGROK_DOMAIN:-set-NGROK_DOMAIN-in-dot-env}
      - host.docker.internal:5004
    extra_hosts:
      # The API runs on the host under `dotnet run`, not in a container.
      - "host.docker.internal:host-gateway"
    ports:
      # ngrok's own request inspector. Worth having open while testing a callback: it shows the
      # exact query string or body the gateway sent, which is what the signature was made over.
      - "4040:4040"

volumes:
  db-data:
  pgadmin-data:
