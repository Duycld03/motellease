services:
  db:
    # PostGIS bắt buộc, không dùng postgres:17-alpine — xem docs/erd.md §8
    image: postgis/postgis:17-3.5
    container_name: motellease-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: motellease
      POSTGRES_USER: motellease
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devonly_change_me}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motellease -d motellease"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: motellease-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@motellease.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-devonly_change_me}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  db-data:
  pgadmin-data:
